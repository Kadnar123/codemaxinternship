<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to your BlogCraft account to manage your articles and stats." />
  <title>Login | BlogCraft</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span>✍️</span> Blog<span>Craft</span>
      </a>

      <nav id="nav-links" class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <div id="nav-user-links" style="display: contents;"></div>
      </nav>

      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">🌙</button>
        <div id="nav-auth-actions" style="display: flex; gap: 0.5rem; align-items: center;"></div>
        <button id="nav-hamburger" class="hamburger-btn" aria-label="Open mobile menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Login Form Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your account to manage your stories</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            class="form-control" 
            placeholder="name@example.com" 
            required 
            autocomplete="email"
          />
          <div class="error-feedback"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-input-wrap">
            <input 
              type="password" 
              id="login-password" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            />
            <button type="button" class="toggle-password-btn" data-target="login-password">Show</button>
          </div>
          <div class="error-feedback"></div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" checked />
            <span>Remember me</span>
          </label>
          <a href="#" onclick="event.preventDefault(); showToast('Password reset link simulated!', 'info');" style="font-size: 0.85rem;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign In</button>

        <!-- Quick Demo Account Fill Button -->
        <button type="button" id="fill-demo-btn" class="btn btn-outline btn-block btn-sm" style="margin-top: 0.75rem;">
          ⚡ Autofill Demo Credentials
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="register.html" style="font-weight: 600;">Create an account</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 BlogCraft. Frontend Internship Project.</p>
    </div>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

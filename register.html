<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a new BlogCraft account to write articles and build your audience." />
  <title>Register | BlogCraft</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span>✍️</span> Blog<span>Craft</span>
      </a>

      <nav id="nav-links" class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <div id="nav-user-links" style="display: contents;"></div>
      </nav>

      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">🌙</button>
        <div id="nav-auth-actions" style="display: flex; gap: 0.5rem; align-items: center;"></div>
        <button id="nav-hamburger" class="hamburger-btn" aria-label="Open mobile menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Register Form Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Join our community of developers and writers</p>
      </div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="register-name">Full Name</label>
          <input 
            type="text" 
            id="register-name" 
            class="form-control" 
            placeholder="Jane Doe" 
            required 
            autocomplete="name"
          />
          <div class="error-feedback"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="register-email">Email Address</label>
          <input 
            type="email" 
            id="register-email" 
            class="form-control" 
            placeholder="jane@example.com" 
            required 
            autocomplete="email"
          />
          <div class="error-feedback"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="register-password">Password</label>
          <div class="password-input-wrap">
            <input 
              type="password" 
              id="register-password" 
              class="form-control" 
              placeholder="Minimum 6 characters" 
              required 
              autocomplete="new-password"
            />
            <button type="button" class="toggle-password-btn" data-target="register-password">Show</button>
          </div>
          <div class="error-feedback"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="register-confirm-password">Confirm Password</label>
          <div class="password-input-wrap">
            <input 
              type="password" 
              id="register-confirm-password" 
              class="form-control" 
              placeholder="Repeat password" 
              required 
              autocomplete="new-password"
            />
            <button type="button" class="toggle-password-btn" data-target="register-confirm-password">Show</button>
          </div>
          <div class="error-feedback"></div>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="register-terms" required checked />
            <span style="font-size: 0.85rem;">I agree to the <a href="#" onclick="event.preventDefault(); showToast('Terms accepted.', 'info');">Terms & Conditions</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html" style="font-weight: 600;">Sign In</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 BlogCraft. Frontend Internship Project.</p>
    </div>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
